[tool.poetry]
name = "loading"
version = "0.1.0"
description = "Matrix data analysis demonstrating pip vs Poetry dependency management"
authors = ["Neo <neo@zion.org>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
pandas = ">=2.0.0"
numpy = ">=1.24.0"
matplotlib = ">=3.7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
